html,body{margin:0;height:100%;background:#0f0c12;overflow:hidden;touch-action:none;font-family:'Nunito',system-ui,sans-serif;user-select:none;-webkit-user-select:none}
canvas#c{display:block;margin:0 auto;touch-action:none}
#ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(8,6,10,.78);color:#eadfc8;text-align:center;z-index:5;touch-action:manipulation;overflow-y:auto}
#ov.hide{display:none}
#ov button{touch-action:manipulation;-webkit-tap-highlight-color:transparent;transition:transform .08s,filter .08s}
.box{background:linear-gradient(#26202c,#141017);border:2px solid #b8913f;box-shadow:0 0 0 4px #1a1418,0 0 0 5px #5a4520,0 14px 34px #000c;padding:16px 18px;max-width:350px;width:86%;clip-path:polygon(14px 0,calc(100% - 14px) 0,100% 14px,100% calc(100% - 14px),calc(100% - 14px) 100%,14px 100%,0 calc(100% - 14px),0 14px);max-height:92vh;overflow-y:auto;box-sizing:border-box}
.box h1{margin:.15em 0;color:#e8c66a;font-size:22px;text-transform:uppercase;letter-spacing:2px;text-shadow:0 2px 0 #000,0 0 12px #b8913f66}
.box h2{margin:.4em 0 .2em;color:#e8c66a;font-size:16px;text-transform:uppercase;letter-spacing:1.5px}
.box p{line-height:1.35;margin:.4em 0}
button{font-family:inherit;font-size:16px;border:1px solid #f3d98a;padding:11px 14px;margin:5px 0;width:100%;background:linear-gradient(#e2bb5c,#a77b2a);color:#1d140a;font-weight:700;cursor:pointer;text-transform:uppercase;letter-spacing:1px;clip-path:polygon(8px 0,calc(100% - 8px) 0,100% 50%,calc(100% - 8px) 100%,8px 100%,0 50%)}
button:disabled{filter:grayscale(1) brightness(.6);cursor:default}
.up{background:linear-gradient(#2e2634,#1c1720);color:#eadfc8;text-align:left;min-height:68px;font-size:16px;padding:12px 14px;margin:7px 0;border:1px solid #6a5430;text-transform:none;letter-spacing:0;clip-path:none}
.up small{display:block;font-weight:400;font-size:14px;margin-top:4px;color:#ece2cc}
.up.press,.up:active{transform:scale(.97);filter:brightness(1.25)}
.up .k{float:right;opacity:.8}
.up .tag{font-size:14px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:#f2d27a}.up.evo{background:linear-gradient(#5a3d12,#2e1f08);box-shadow:0 0 14px #ffb000aa;border-color:#ffcc55}
.up small i{opacity:1}.row{display:flex;gap:8px}.act{background:linear-gradient(#4a3d55,#2d2436);color:#eadfc8;font-size:14px;padding:9px;border-color:#7a6a8a}
.snd{position:fixed;bottom:8px;width:38px;height:38px;padding:0;margin:0;font-size:16px;background:#1d1722;color:#e8c66a;border:1px solid #b8913f;z-index:10;clip-path:none;border-radius:4px}
#bm{right:8px}#bs{right:52px}.snd.off{opacity:.45;text-decoration:line-through}
.hub{width:92%;max-width:370px;color:#eadfc8}
.cur{display:flex;justify-content:space-between;font-weight:700;padding:6px 10px;background:#15111a;border:1px solid #5a4520;margin:0 0 8px;font-size:16px}
.grid5{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}.grid5 button{position:relative;font-size:14px;padding:12px 2px;margin:0;background:linear-gradient(#3a2f44,#221b29);color:#eadfc8;border-color:#7a6440;letter-spacing:.3px;overflow:visible}
.grid5 button small{display:block;font-size:14px;text-transform:none;opacity:1}.grid5 .soon img,.grid5 .soon canvas{filter:grayscale(1) brightness(.6)}
.badge{position:absolute;top:-6px;right:2px;background:#d42a2a;color:#fff;border-radius:9px;min-width:16px;height:16px;line-height:16px;font-size:14px;padding:0 3px;box-shadow:0 0 0 2px #1a1418}
.arrow{position:absolute;top:60px;width:40px;z-index:2}.world{background:#120f15;border:1px solid #5a4520;padding:5px;margin:6px 0 0;font-size:14px}
.evh{float:right;margin-right:8px;font-size:14px;padding:1px 6px 1px 2px;border:1px dashed #6a5430;color:#ece2cc;display:inline-flex;align-items:center;gap:3px}.evh img{width:16px;height:16px}.evh.own{border:2px solid #6fe08a;color:#bff5c8;font-weight:700}
.mini{width:auto;display:inline-block;font-size:14px;padding:3px 8px;margin:2px 0;clip-path:none}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}.grid button{font-size:14px;padding:12px 4px;margin:0;background:linear-gradient(#3a2f44,#221b29);color:#eadfc8;border-color:#7a6440}
.big{font-size:22px;padding:16px;margin:8px 0}
.li{display:flex;align-items:center;gap:8px;text-align:left;background:#1d1822;border:1px solid #4a3b28;padding:7px 9px;margin:5px 0;font-size:14px}
.li .g{flex:1}.li button{width:auto;font-size:14px;padding:7px 12px;margin:0}
.dim{opacity:1}.dim img,.dim canvas,.dim .ric{opacity:.45;filter:grayscale(.6)}.dim>*{opacity:.85}.odds{font-size:14px;color:#ece2cc;text-align:left;background:#120f15;border:1px solid #3a2f22;padding:6px 8px;margin:4px 0}
.gold{color:#f2cf5b}.gem{color:#7fe3ff}
#ov.lob{background:none;display:block;overflow:hidden}
#bg{position:absolute;inset:0;width:100%;height:100%;z-index:0}
#lobby{position:absolute;inset:0;display:flex;flex-direction:column;z-index:1}
#lobby::after{content:'';position:absolute;inset:4px;border:2px solid #b8913f;box-shadow:inset 0 0 0 3px #1a1418cc,inset 0 0 0 4px #5a452088,inset 0 0 50px #000a;pointer-events:none;z-index:3}
.topbar{display:flex;gap:6px;align-items:center;padding:12px 12px 4px}.topbar .cur{flex:1;margin:0;background:linear-gradient(#221b28ee,#120e16ee);border-color:#8a6a2a}
.ib{width:auto;margin:0;padding:6px 11px;background:linear-gradient(#3a2f44,#221b29);color:#e8c66a;border:1px solid #8a6a2a;clip-path:none;font-size:16px;letter-spacing:0}.ib.small{font-size:14px;padding:5px 9px}
#pages{flex:1;overflow:hidden;position:relative}
#track{display:flex;width:600%;height:100%;transition:transform .32s cubic-bezier(.2,.8,.2,1)}
.page{flex:0 0 16.6667%;height:100%;overflow-y:auto;padding:4px 16px 14px;box-sizing:border-box;touch-action:pan-y}
.page .pbody,#sheet .pbody{max-width:430px;margin:0 auto}
h1.ph{margin:.2em 0 .3em;color:#e8c66a;font-size:22px;text-transform:uppercase;letter-spacing:2px;text-shadow:0 2px 0 #000,0 0 12px #b8913f66}
.page .li{background:#1d1822ee}.page .odds{background:#120f15ee}
#tabs{position:relative;z-index:4;display:grid;grid-template-columns:repeat(6,1fr);gap:3px;padding:8px 9px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(#1d1722f5,#0c090f);border-top:2px solid #b8913f}
.tab{position:relative;margin:0;padding:6px 0 5px;font-size:14px;letter-spacing:.2px;background:linear-gradient(#2c2433,#18131d);color:#ece2cc;border:1px solid #5a4520;clip-path:none;overflow:visible;transition:transform .15s}
.tab .ti{display:block;font-size:22px;line-height:22px;color:#c9a24a}
.tab.on{background:linear-gradient(#6a5126,#2a1f10);color:#fff;transform:translateY(-5px);border-color:#f3d98a;box-shadow:0 0 14px #e8c66a77}.tab.on .ti{color:#fff3c4}

/* ================= MAGIC SOURCES = WEAPON CRAFTING ================= 
 Each hero has a source that fills like an XP bar. Full = choose a new weapon or weapon upgrade ('craftables').
 perXp: fill per XP point, perSec: fill per second, perDmg/perHurt: fill per damage dealt/taken, need(n): needed for the n-th craft. */
function srcDef(id,o){return Object.assign({id,get name(){return T('src.'+id)},get title(){return T('src.'+id+'.title')},get desc(){return T('src.'+id+'.desc')}},o);}
const SOURCES={
 cauldron:srcDef('cauldron',{col:'#3ce08a',col2:'#0e6b3a',perXp:1,perSec:.5,need:n=>Math.round(45+n*28),draw:drawVesCauldron}),
 spellbook:srcDef('spellbook',{col:'#7fb8ff',col2:'#23407a',perXp:1,perSec:.5,need:n=>Math.round(45+n*28),draw:drawVesBook}),
 wardrum:srcDef('wardrum',{col:'#ff7a3a',col2:'#7a2a10',perXp:0,perSec:.3,perDmg:.05,perHurt:1.2,need:n=>Math.round(45+n*28),draw:drawVesDrum}),
 lifetree:srcDef('lifetree',{col:'#9be06a',col2:'#2f5a1e',perXp:1,perSec:.5,need:n=>Math.round(45+n*28),draw:drawVesTree})};

/* ================= HEROES ================= */
// Hero movement speed (world units per second), tuned per hero. v0.1.5b: both 12% slower (witch 200→176, barbarian 182→160).
const HERO_MOVE_SPEED={witch:BALANCE.heroes.witch.spd,barbarian:BALANCE.heroes.barbarian.spd};
function heroDef(id,o){return Object.assign({id,get name(){return T('hero.'+id)},get style(){return T('hero.'+id+'.style')}},o);}
const HEROES={
 witch:heroDef('witch',{playable:true,hp:BALANCE.heroes.witch.hp,spd:BALANCE.heroes.witch.spd,r:15,source:SOURCES.cauldron,startWeapon:'missile',draw:drawWitch,bolt:'#b9f3ff',col:'#6a3fa0',glow:'#5cff8a'}),
 wizard:heroDef('wizard',{playable:false,hp:BALANCE.heroes.wizard.hp,spd:BALANCE.heroes.wizard.spd,r:15,source:SOURCES.spellbook,startWeapon:'chain',draw:drawWitch,bolt:'#c9a8ff',col:'#2f4f9a',glow:'#a98bff'}),
 barbarian:heroDef('barbarian',{playable:true,hp:BALANCE.heroes.barbarian.hp,spd:BALANCE.heroes.barbarian.spd,r:17,source:SOURCES.wardrum,startWeapon:'axe',draw:drawBarbarian,bolt:'#ffb070',col:'#9a3a1f',glow:'#ff9a3c'}),
 elf:heroDef('elf',{playable:false,hp:BALANCE.heroes.elf.hp,spd:BALANCE.heroes.elf.spd,r:14,source:SOURCES.lifetree,startWeapon:'orbit',draw:drawWitch,bolt:'#c8ff9a',col:'#3f7a2a',glow:'#9fe8ff'})};

// 0.2.7 heroic arrangement (all synthesized here, no samples): soft brass lead + brass chord swells (filtered saws),
// timpani-style kick, a soft snare and a tom fill at the end of each 8-bar phrase. Same chords/tempo/loop as before.
function brass(f,d,vol,at,cut){const a=AC;if(!a)return;const g=a.createGain(),lp=a.createBiquadFilter();lp.type='lowpass';lp.frequency.setValueAtTime((cut||1400)*.6,at);lp.frequency.linearRampToValueAtTime(cut||1400,at+.08);lp.Q.value=.7;

 if(st%8==4)tone(190,.1,'triangle',.035,120,0,MUS,musT);

 if(st%2==1)noise(.035,.012,MUS,musT,7000);
 musT+=STEP;musStep++;if(musStep%128==0)makeMelody();}}

  '<p><small>'+T('dbg.date',dkey(nowD()),M.weekly.wk||'–')+'</small></p><table class="dbgt"><tr><th>'+T('dbg.lv')+'</th><th>'+T('dbg.runs')+'</th><th>'+T('dbg.wins')+'</th><th>%</th><th>'+T('dbg.rage')+'</th><th>%</th></tr>'+st+'</table></div>';
 const done=()=>{el.remove();if(DBG.wasPlay&&S&&S.state=='dbgpause'){S.state='play';lt=performance.now();}DBG.wasPlay=false;refreshTop&&refreshTop();if(!S&&document.getElementById('pg_home'))renderHome();};
 el.querySelectorAll('[data-d]').forEach(b=>b.addEventListener('click',e=>{e.preventDefault();const k=b.dataset.d;if(k=='tut'){DBG.wasPlay=false;skipTutorial();return;}
  if(k.startsWith('lv')){DBG.wasPlay=false;const n=+k[2];M.maxLvl=Math.max(M.maxLvl,n);M.lvlSel=n;save();el.remove();startRun();return;}
  if(k=='wkrun'){DBG.wasPlay=false;el.remove();startRun('weekly');return;}
  if(k=='boss'){if(S&&!S.bossSpawned)spawnBoss();done();return;}
  if(k=='rage'){if(S&&S.boss&&S.boss.hp>0){S.boss.hp=Math.min(S.boss.hp,S.boss.max*S.L.rageHp);S.boss.introT=0;}done();return;}
  if(k=='gold')M.gold+=1000;if(k=='gems')M.gems+=100;if(k=='inv')DBG.inv=!DBG.inv;if(k=='range')M.rangeOn=M.rangeOn?0:1;
  if(k=='daily')M.daily.date='';if(k=='weekly')M.weekly.wk='';
  if(k=='day'||k=='week'){try{localStorage.setItem('sph_dbg_day',(+localStorage.getItem('sph_dbg_day')||0)+(k=='day'?1:7))}catch(e){}}
  if(k=='close'){done();return;}save();dbgMenu();}));}

// Marks intro + first run/tutorial as done and grants the first-clear chest exactly once per save (guaranteed barbarian shards + 1 roll on opening).

 if(grant){M.cleared[1]=1;M.maxLvl=Math.max(M.maxLvl,2);M.lvlSel=M.maxLvl;M.firstSilver=1;addChest('silver','first',{first:1});if(!M.chestHint)M.chestHint=1;}
 save();ov.onclick=null;storyI=-1;RUNMODE=null;S=null;const d=document.getElementById('dbg');if(d)d.remove();showHub();}

/* ===== 0.3.3 progress backup code: no account, no personal data. Code = SPH<ver>.<base64url(deflate(save))>.<crc32> ===== */
const BK_V=1;
function crc32(str){let c,crc=-1;for(let i=0;i<str.length;i++){c=(crc^str.charCodeAt(i))&255;for(let k=0;k<8;k++)c=c&1?(c>>>1)^0xEDB88320:c>>>1;crc=(crc>>>8)^c;}return ((crc^-1)>>>0).toString(16).padStart(8,'0');}
const b64u=b=>{let s='';const a=new Uint8Array(b);for(let i=0;i<a.length;i++)s+=String.fromCharCode(a[i]);return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');};
const unb64u=t=>{t=t.replace(/-/g,'+').replace(/_/g,'/');while(t.length%4)t+='=';const s=atob(t),a=new Uint8Array(s.length);for(let i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a;};
async function zip(str,inflate){const cs=inflate?new DecompressionStream('deflate-raw'):new CompressionStream('deflate-raw');const st=new Blob([str]).stream().pipeThrough(cs);return new Uint8Array(await new Response(st).arrayBuffer());}
async function exportCode(){const d=JSON.parse(JSON.stringify(M));delete d.lang;const body=b64u(await zip(JSON.stringify(d)));return 'SPH'+BK_V+'.'+body+'.'+crc32(body);}
async function parseCode(code){code=String(code||'').replace(/\s+/g,'');const m=code.match(/^SPH(\d+)\.([A-Za-z0-9_-]+)\.([0-9a-f]{8})$/);if(!m)return {err:'bk.errFormat'};if(+m[1]!==BK_V)return {err:'bk.errVersion'};if(crc32(m[2])!==m[3])return {err:'bk.errCheck'};
 try{const json=new TextDecoder().decode(await zip(unb64u(m[2]),true)),d=JSON.parse(json);if(!d||typeof d!='object'||typeof d.v!='number')return {err:'bk.errData'};return {data:d};}catch(e){return {err:'bk.errData'};}}
